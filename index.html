    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.coreohub.com/#organization",
          "name": "CoreoHub",
          "url": "https://www.coreohub.com/",
          "logo": "https://www.coreohub.com/coreohub-avatar.png",
          "description": "CoreoHub é a plataforma completa de gestão para produtores de festivais de dança, oferecendo inscrições, pagamentos, júri digital, cronograma inteligente, bilheteria, check-in e certificados automáticos."
        },
        {
          "@type": "SoftwareApplication",
          "name": "CoreoHub",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://www.coreohub.com/",
          "description": "Plataforma de gestão de festivais de dança: inscrições online, pagamentos via split automático (Asaas), júri digital por tablet (funciona offline), cronograma inteligente, bilheteria, check-in por QR code e emissão automática de certificados.",
          "publisher": { "@id": "https://www.coreohub.com/#organization" },
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "BRL",
            "description": "Sem mensalidade e sem fidelidade. Cobrança apenas por comissão sobre as inscrições vendidas."
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Como recebo o dinheiro das inscrições?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Direto na sua conta bancária via Asaas (regulamentado pelo Banco Central). Cada inscrição paga gera split na hora — 90% pra você, 10% comissão CoreoHub. Sem boleto perdido, sem espera de 30 dias, sem repasse mensal."
              }
            },
            {
              "@type": "Question",
              "name": "Funciona mesmo offline?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim. Avaliação de jurados, cronograma, check-in por QR e narração funcionam mesmo sem internet no local — o app sincroniza automaticamente quando a conexão volta. Você só precisa de internet pra publicar o evento e receber pagamentos."
              }
            },
            {
              "@type": "Question",
              "name": "E se eu quiser sair? Tem fidelidade?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Não. Não existe contrato de permanência nem multa de cancelamento — você usa enquanto fizer sentido pro seu festival. Se decidir sair, seu histórico de eventos, inscrições e certificados continua acessível e exportável, sem prazo de expiração."
              }
            },
            {
              "@type": "Question",
              "name": "Tem suporte técnico?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim, direto por WhatsApp com nossa equipe — sem ticket, sem fila de atendimento genérico. Na semana do seu festival, o suporte é prioritário: se algo travar no dia, você fala com a gente na hora, não espera resposta de central."
              }
            },
            {
              "@type": "Question",
              "name": "Quantos festivais por mês posso criar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Quantos quiser. Não há limite de festivais, edições ou mostras — você paga só a comissão de cada inscrição vendida, então pode rodar um evento por mês ou dez, sem custo fixo te travando."
              }
            },
            {
              "@type": "Question",
              "name": "Funciona pra evento gratuito ou edital público?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Sim — temos modelo específico para eventos gratuitos, mostras municipais e editais públicos. Como cada caso tem particularidades (tipo de evento, instituição, verba), fale com a gente pelo WhatsApp e montamos a proposta certa pro seu caso."
              }
            }
          ]
        }
      ]
    }
    </script>

    <!-- GA4 + Meta Pixel da CoreoHub (LGPD-compliant).
         Os scripts NÃO carregam automaticamente. App.tsx checa o consent
         (utils/consent.ts) e chama window.__loadCoreohubMarketing() quando
         o usuário aceita marketing no banner. Sem consent → sem cookies
         de marketing, sem identificação cross-site.
         Roda nos domínios de produção (app + marketing) pra não poluir GA
         com dev/staging/preview do Vercel. -->
    <script>
      window.__loadCoreohubMarketing = function () {
        var PROD_HOSTS = ['app.coreohub.com', 'coreohub.com', 'www.coreohub.com'];
        if (PROD_HOSTS.indexOf(window.location.hostname) === -1) return;
        if (window.__coreohubMarketingLoaded) return;
        window.__coreohubMarketingLoaded = true;

        // ── GA4 ──────────────────────────────────────────────
        var GA_ID = 'G-Y7N93KHNP8';
        var gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(gtagScript);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID, { send_page_view: false });

        // ── Meta Pixel ───────────────────────────────────────
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', '968125229155814');
        window.fbq('track', 'PageView');
      };
    </script>
</head>
<body class="bg-mesh min-h-screen">
    <!-- Meta Pixel fallback pra navegadores sem JS — DEVE ficar no <body>
         (HTML5 não permite <noscript> com conteúdo dentro do <head>;
         parse5/Rollup quebra o build). -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=968125229155814&ev=PageView&noscript=1"
      alt="" /></noscript>
    <!-- #14 mudança 3: redirect inline pre-React quando tablet em modo Terminal
         abre na raiz '/'. Evita flash da raiz antes do RootRedirect rodar.
         Roda síncrono ANTES do bundle React baixar — instantaneo no PWA. -->
    <script>
      (function () {
        try {
          var path = window.location.pathname;
          if (path === '/' || path === '/index.html') {
            var isKiosk = localStorage.getItem('coreohub_tablet_kiosk_mode') === 'true';
            var token = localStorage.getItem('coreohub_tablet_judge_token');
            if (isKiosk && token) {
              window.location.replace('/judge-login/' + token);
            }
          }
        } catch (e) { /* localStorage indisponível: deixa o React lidar */ }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
